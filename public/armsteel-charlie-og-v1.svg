  <text x="98" y="337" fill="#262523" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" letter-spacing="-1.8">Charlie Arnerstål</text>
  <text x="100" y="419" fill="#514e49" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="0.1">Software / Systems / Electronics / Experiments</text>

